<svg width="4096" height="4096" xmlns="http://www.w3.org/2000/svg">
  <!-- GTA 5 Map Placeholder - Replace with actual grayscale map image -->
  <defs>
    <linearGradient id="mapGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e0e0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a0a0a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#808080;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="4096" height="4096" fill="url(#mapGradient)"/>
  
  <!-- Grid lines to simulate map -->
  <g stroke="#606060" stroke-width="2" opacity="0.3">
    <!-- Vertical lines -->
    <line x1="512" y1="0" x2="512" y2="4096"/>
    <line x1="1024" y1="0" x2="1024" y2="4096"/>
    <line x1="1536" y1="0" x2="1536" y2="4096"/>
    <line x1="2048" y1="0" x2="2048" y2="4096"/>
    <line x1="2560" y1="0" x2="2560" y2="4096"/>
    <line x1="3072" y1="0" x2="3072" y2="4096"/>
    <line x1="3584" y1="0" x2="3584" y2="4096"/>
    
    <!-- Horizontal lines -->
    <line x1="0" y1="512" x2="4096" y2="512"/>
    <line x1="0" y1="1024" x2="4096" y2="1024"/>
    <line x1="0" y1="1536" x2="4096" y2="1536"/>
    <line x1="0" y1="2048" x2="4096" y2="2048"/>
    <line x1="0" y1="2560" x2="4096" y2="2560"/>
    <line x1="0" y1="3072" x2="4096" y2="3072"/>
    <line x1="0" y1="3584" x2="4096" y2="3584"/>
  </g>
  
  <!-- Text label -->
  <text x="2048" y="2048" font-family="Arial" font-size="120" fill="#505050" text-anchor="middle" dominant-baseline="middle">
    GTA 5 Map Placeholder
  </text>
  <text x="2048" y="2200" font-family="Arial" font-size="60" fill="#606060" text-anchor="middle" dominant-baseline="middle">
    Replace with actual grayscale map image
  </text>
</svg>
